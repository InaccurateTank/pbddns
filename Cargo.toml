[package]
name = "pbddns"
version = "0.4.0"
edition = "2024"

[dependencies]
color-eyre = { version = "0.6" }
gumdrop = { version = "0.8" }
toml = { version = "0.8" }

serde.workspace = true
thiserror.workspace = true
ureq.workspace = true

pb_api = { path = "pb_api" }

[workspace]
publish = false
members = ["pb_api"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = { version = "2.0" }
ureq = { version = "3.0", features = ["json"] }
