[package]
name = "pbddns"
version = "0.4.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
gumdrop = { version = "0.8" }
toml = { version = "0.8" }
ureq = { version = "3.0", features = ["json"] }

serde.workspace = true
thiserror.workspace = true

pb_api = { path = "pb_api" }

[workspace]
publish = false
members = ["pb_api"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = { version = "2.0" }
